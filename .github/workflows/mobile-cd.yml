name: Mobile CD

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve EAS build profile
        id: build-profile
        run: |
          case "${GITHUB_REF_NAME}" in
            develop)
              echo "profile=preview" >> "$GITHUB_OUTPUT"
              ;;
            main|master)
              echo "profile=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Build Android APK
        run: eas build --platform android --profile ${{ steps.build-profile.outputs.profile }} --non-interactive --no-wait
